services:
  postgres:
    # Keep the image tag in sync with TestcontainersConfiguration.
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rejuv}
      POSTGRES_USER: ${POSTGRES_USER:-rejuv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    image: rejuv:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      WEB_BIND_ADDRESS: "0.0.0.0"
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      DONATION_URL: ${DONATION_URL:-}
      DONATION_LABEL: ${DONATION_LABEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.9
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
