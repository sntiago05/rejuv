spring:
  application:
    name: rejuv
  main:
    web-application-type: none
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rejuv}
    username: ${POSTGRES_USER:rejuv}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

bot:
  token: ${DISCORD_TOKEN:}
  dev-guild-id: ${DEV_GUILD_ID:}

deadlock-api:
  base-url: https://api.deadlock-api.com
  connect-timeout: 3s
  read-timeout: 10s
  default-retry-after: 2s
  max-retry-after: 10s

anthropic:
  base-url: https://api.anthropic.com
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-haiku-5-5
  effort: low
  max-tokens: 1500
  connect-timeout: 3s
  read-timeout: 30s
  default-retry-after: 1s
  max-retry-after: 10s
  pricing:
    input-usd-per-million: 0
    output-usd-per-million: 0
