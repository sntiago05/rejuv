spring:
  application:
    name: rejuv
  main:
    web-application-type: none
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rejuv}
    username: ${POSTGRES_USER:rejuv}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

bot:
  token: ${DISCORD_TOKEN:}
  dev-guild-id: ${DEV_GUILD_ID:}

deadlock-api:
  base-url: https://api.deadlock-api.com
  connect-timeout: 3s
  read-timeout: 10s
  default-retry-after: 2s
  max-retry-after: 10s
