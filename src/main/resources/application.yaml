spring:
  application:
    name: rejuv
  thymeleaf:
    cache: true
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rejuv}
    username: ${POSTGRES_USER:rejuv}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    # The web report reads entities only inside repository calls (no lazy associations), so the request does not
    # need a session; with it on, a report view held a pooled connection while waiting on deadlock-api (task 039).
    open-in-view: false

bot:
  token: ${DISCORD_TOKEN:}
  dev-guild-id: ${DEV_GUILD_ID:}

deadlock-api:
  base-url: https://api.deadlock-api.com
  connect-timeout: 3s
  read-timeout: 10s
  default-retry-after: 2s
  max-retry-after: 10s

anthropic:
  base-url: https://api.anthropic.com
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-haiku-5-5
  effort: low
  max-tokens: 1500
  connect-timeout: 3s
  read-timeout: 30s
  default-retry-after: 1s
  max-retry-after: 10s
  pricing:
    input-usd-per-million: 0
    output-usd-per-million: 0

server:
  port: ${WEB_PORT:8080}
  address: ${WEB_BIND_ADDRESS:127.0.0.1}
  error:
    include-stacktrace: never

rejuv:
  web:
    base-url: ${WEB_BASE_URL:}
  usage:
    enabled: ${USAGE_LIMITS_ENABLED:false}
    weekly-free-analyses: ${USAGE_WEEKLY_FREE_ANALYSES:3}
  premium:
    enabled: ${PREMIUM_ROLE_CHECK_ENABLED:false}
    guild-id: ${PREMIUM_GUILD_ID:}
    role-id: ${PREMIUM_ROLE_ID:}
