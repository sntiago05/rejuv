spring:
  application:
    name: rejuv
  main:
    web-application-type: none
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:rejuv}
    username: ${POSTGRES_USER:rejuv}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

bot:
  token: ${DISCORD_TOKEN:}
  dev-guild-id: ${DEV_GUILD_ID:}
