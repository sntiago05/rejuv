<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="color-scheme" content="dark light">
    <title th:text="#{report.not_found.title}">Report Not Found</title>
    <link rel="stylesheet" th:href="@{/report.css}" href="/report.css">
</head>
<body class="min-h-screen px-4 py-16 antialiased sm:px-6">
    <main class="mx-auto max-w-md space-y-6 text-center">
        <div class="panel">
            <h1 class="page-title mb-2 !text-2xl" th:text="#{report.not_found.title}">Report Not Found</h1>
            <p class="muted" th:text="#{report.not_found.body}">This report does not exist or has been removed.</p>
        </div>
        <footer class="muted text-sm">
            <p class="font-semibold" th:text="#{report.footer}">Rejuv · AI coach for Deadlock</p>
        </footer>
    </main>
</body>
</html>
