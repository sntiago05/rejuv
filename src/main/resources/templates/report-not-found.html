<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title th:text="#{report.not_found.title}">Report Not Found</title>
    <link rel="stylesheet" th:href="@{/report.css}" href="/report.css">
</head>
<body class="bg-light-bg text-light-text dark:bg-dark-bg dark:text-dark-text antialiased font-sans min-h-screen py-16 px-4 sm:px-6 print:bg-white print:text-black">
    <main class="max-w-md mx-auto space-y-6 text-center">
        <div class="bg-light-card dark:bg-dark-card border border-light-border dark:border-dark-border rounded-xl p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-light-text dark:text-white mb-2" th:text="#{report.not_found.title}">Report Not Found</h1>
            <p class="text-sm text-light-muted dark:text-dark-muted" th:text="#{report.not_found.body}">This report does not exist or has been removed.</p>
        </div>
        <footer class="pt-4 text-xs text-light-muted dark:text-dark-muted">
            <p class="font-medium text-light-text dark:text-dark-text" th:text="#{report.footer}">Rejuv · AI coach for Deadlock</p>
        </footer>
    </main>
</body>
</html>
